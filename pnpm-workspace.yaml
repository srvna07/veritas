packages:
  - frontend
  - backend
  - packages/*

# One version of each shared dependency across the monorepo.
catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/node': ^22.19.0
  '@mui/material': ^9.5.0
  '@mui/material-nextjs': ^9.5.0
  '@emotion/react': ^11.14.0
  '@emotion/styled': ^11.14.1
  '@emotion/cache': ^11.14.0
  zod: ^4.6.7
  typescript: ~5.9.3
  vitest: ^5.1.1
  eslint: ^9.39.0
  '@eslint/js': ^9.39.0
  typescript-eslint: ^8.73.0

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
